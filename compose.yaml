```yaml
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maison
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définis MYSQL_ROOT_PASSWORD}
      MYSQL_USER: maison_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./maison-serveur/shema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - maison-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: maison_app
      DB_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD}
      DB_NAME: maison
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maison-net

volumes:
  mysql_data:

networks:
  maison-net:
```